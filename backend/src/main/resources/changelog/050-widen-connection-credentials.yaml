databaseChangeLog:
  - changeSet:
      id: 050-widen-connection-credentials
      author: jascha
      # Encrypted credentials carry a format prefix, an IV and an authentication tag on top of the
      # plaintext, so a long password no longer reliably fits into VARCHAR(255).
      changes:
        - modifyDataType:
            tableName: connection
            columnName: username
            newDataType: TEXT
        - modifyDataType:
            tableName: connection
            columnName: password
            newDataType: TEXT
