spring:
  jackson:
    # Keep Jackson 2's defaults so API responses and the event payloads stored as JSON stay
    # byte-compatible across the Jackson 3 upgrade.
    use-jackson2-defaults: true
  liquibase:
    change-log: classpath:changelog/000-changelog.yaml
  datasource:
    url: jdbc:h2:mem:mydb;MODE=LEGACY
    username: sa
    password:
    driverClassName: org.h2.Driver
  jpa:
    properties:
      hibernate:
        auto_quote_keyword: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8081
app:
  name: "Kviklet"
  in-docker: true
  version: "dev"
  build-date: "unknown"
  git-commit: "unknown"
