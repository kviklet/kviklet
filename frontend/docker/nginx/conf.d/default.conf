map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # No page may be framed: an invisible frame could otherwise trick a click on e.g. the MCP
        # consent screen's "Allow access". The API sets its own frame options.
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
    }

    # OAuth discovery for MCP clients. The metadata of the authorization server (issuer .../api) and
    # of the MCP endpoint (.../api/mcp) live at /.well-known/<type>/api..., with the path after the
    # well-known segment (RFC 8414, RFC 9728), so they are outside /api/ and routed here explicitly.
    location ~ ^/\.well-known/(oauth-authorization-server|oauth-protected-resource)/api(/.*)?$ {
        proxy_pass http://127.0.0.1:8081/.well-known/$1$2;
        # $http_host keeps the port, which the backend needs for the absolute URLs it builds.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        proxy_pass http://localhost:8081/;
        # $http_host keeps the port, which the backend needs for the absolute URLs it builds.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Keep WebSocket connections alive
        proxy_read_timeout 86400;
    }
}