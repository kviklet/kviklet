# Primary application configuration
config:
  datasource:
    # Default datasource URL - override via externalSecretName
    # For production, provide SPRING_DATASOURCE_URL in your secret
    url: "jdbc:postgresql://your-database-host:5432/kviklet"

  logging:
    # Console log format. Defaults to structured JSON (ecs) so logs are easy to
    # index in aggregators like Elasticsearch, Loki, Datadog or CloudWatch.
    # One of: ecs (Elastic Common Schema), logstash, gelf (Graylog).
    # Set to "" (empty) for human-readable plain-text logs.
    structuredFormat: "ecs"

  oidc:
    enabled: false
    provider: "" # google, keycloak, gitlab
    issuerUri: "" # Required for keycloak and other providers

  ldap:
    enabled: false
    url: ""
    base: ""
    principal: ""
    attributes:
      uniqueIdentifier: "uid"
      email: "mail"
      fullName: "cn"
    organization:
      userOu: "people"
      searchBase: "ou=people"

  # Database access proxies (experimental). Each enabled proxy binds a
  # long-lived listener inside the pod at startup; disabling one skips the
  # bind entirely. To make the listeners reachable by database clients, also
  # enable proxyService below.
  proxy:
    postgres:
      enabled: true
      port: 5432
    # One listener serves both MySQL and MariaDB.
    mysql:
      enabled: true
      port: 3306

# Name of the secret containing the kviklets configuration
# See README.md or the demo deployment for examples
externalSecretName: "kviklet-secret"

# Application deployment configuration
image:
  registry: ghcr.io
  repository: kviklet/kviklet
  pullPolicy: Always
  tag: main

service:
  type: ClusterIP
  port: 80

# Separate service exposing the database proxy listeners. Database clients
# speak raw TCP (an HTTP ingress cannot carry this traffic), so this is
# typically a LoadBalancer (or NodePort / an ingress controller with TCP
# passthrough). Kept separate from the HTTP service above so that one can
# stay ClusterIP behind an ingress.
proxyService:
  enabled: false
  type: LoadBalancer
  annotations: {}

# -- Define resources for kviklet pods.
# see https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#resources
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# -- see https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#scheduling
nodeSelector: {}

# -- see https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#scheduling
tolerations: []

# -- see https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#scheduling
affinity: {}
